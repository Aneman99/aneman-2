<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BORED - Beat Boredom</title>
<meta name="theme-color" content="#0f0f1a">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0f0f1a;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;padding:12px 16px;font-weight:800;font-size:14px}
.top span{background:#1e1e35;padding:6px 10px;border-radius:20px}
#timer{color:#ff4757} #combo{color:#ffa502} #score{color:#2ed573}
#board{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:420px;margin:0 auto;width:100%}
.tile{border-radius:20px;cursor:pointer;transition:.15s;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.tile:active{transform:scale(.95)}
.tile.flash{filter:brightness(2);transform:scale(1.05)}
#t0{background:#ff6b81} #t1{background:#ffa502} #t2{background:#2ed573} #t3{background:#1e90ff}
#msg{text-align:center;font-size:22px;font-weight:900;min-height:32px}
#sub{text-align:center;font-size:13px;opacity:.6;margin-bottom:8px}
#startBtn{background:linear-gradient(90deg,#ff4757,#ffa502);border:none;color:#fff;font-weight:900;font-size:18px;padding:16px 32px;border-radius:30px;margin:10px auto;cursor:pointer}
#doubleBtn{background:#1e1e35;color:#ffa502;border:2px solid #ffa502;padding:10px 20px;border-radius:20px;font-weight:800;cursor:pointer;display:none;margin:5px auto}
#adBanner{height:60px;background:#000;text-align:center;border-top:1px solid #222;overflow:hidden}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-3258857946470272" crossorigin="anonymous"></script>
</head>
<body>
<div class="top">
<span>⏱ <b id="timer">30</b>s</span>
<span>🔥 COMBO <b id="combo">x1</b></span>
<span>🏆 <b id="score">0</b></span>
</div>
<div id="msg">BORED?</div>
<div id="sub">Watch pattern. Repeat it. Beat the clock.</div>
<div id="board">
<div class="tile" id="t0" onclick="tap(0)"></div>
<div class="tile" id="t1" onclick="tap(1)"></div>
<div class="tile" id="t2" onclick="tap(2)"></div>
<div class="tile" id="t3" onclick="tap(3)"></div>
</div>
<button id="startBtn" onclick="startGame()">▶ PLAY BORED</button>
<button id="doubleBtn" onclick="doubleOrNothing()">🎲 DOUBLE OR NOTHING (x2 Score)</button>
<div id="adBanner">
<ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="ca-app-pub-3258857946470272" data-ad-slot="8896483169"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
<script>
let seq=[], userSeq=[], score=0, level=1, timerInt, timeLeft=30, combo=1, playing=false;
let sounds=[220,330,440,550];
function playTone(i){try{let a=new (window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator();o.frequency.value=sounds[i];o.connect(a.destination);o.start();o.stop(a.currentTime+0.15)}catch(e){}}
function flash(i){let el=document.getElementById('t'+i);el.classList.add('flash');playTone(i);setTimeout(()=>el.classList.remove('flash'),300)}
function showPattern(){let i=0;let int=setInterval(()=>{flash(seq[i]);i++;if(i>=seq.length)clearInterval(int)},500)}
function startGame(){seq=[];userSeq=[];score=0;level=1;combo=1;timeLeft=30;playing=true;document.getElementById('startBtn').style.display='none';document.getElementById('doubleBtn').style.display='none';updateUI();nextLevel();startTimer()}
function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{timeLeft--;document.getElementById('timer').innerText=timeLeft;if(timeLeft<=0)gameOver()},1000)}
function nextLevel(){userSeq=[];document.getElementById('msg').innerText='LEVEL '+level+' - WATCH!';seq.push(Math.floor(Math.random()*4));setTimeout(showPattern,600)}
function tap(i){if(!playing)return;flash(i);userSeq.push(i);if(userSeq[userSeq.length-1]!==seq[userSeq.length-1]){gameOver();return}if(userSeq.length===seq.length){score+=10*combo*level;combo++;if(combo>8)combo=8;level++;updateUI();document.getElementById('msg').innerText='NICE! +'+(10*combo)+' 🔥';setTimeout(nextLevel,800)}}
function updateUI(){document.getElementById('score').innerText=score;document.getElementById('combo').innerText='x'+combo;document.getElementById('timer').innerText=timeLeft}
function gameOver(){playing=false;clearInterval(timerInt);document.getElementById('msg').innerText='GAME OVER! Score: '+score;document.getElementById('sub').innerText='Your brain got BORED? Try again!';document.getElementById('startBtn').style.display='block';document.getElementById('startBtn').innerText='↻ PLAY AGAIN';document.getElementById('doubleBtn').style.display='block';}
function doubleOrNothing(){if(Math.random()>0.5){score*=2;document.getElementById('msg').innerText='DOUBLED! '+score+' 🎉';}else{score=0;document.getElementById('msg').innerText='LOST IT ALL! 😭';}updateUI();document.getElementById('doubleBtn').style.display='none'}
</script>
</body>
</html>
