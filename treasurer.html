<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TREASURER SIDE - Stokvel | Aneman</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#052e16;color:#fff;min-height:100vh}
.top{background:#022c22;padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #14532d;position:sticky;top:0}
.card{background:#14532d;border:1px solid #166534;border-radius:16px;padding:16px;margin:12px}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;margin-top:8px}
.btn-y{background:#facc15;color:#000}.btn-g{background:#22c55e;color:#fff}.btn-r{background:#ef4444;color:#fff}.btn-d{background:#022c22;color:#fff;border:1px solid #166534}
.input{background:#022c22;border:1px solid #166534;padding:12px;border-radius:10px;color:#fff;width:100%;margin-top:8px;outline:none}
#login{position:fixed;inset:0;background:#022c22;display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.box{background:#fff;color:#000;padding:28px;border-radius:20px;max-width:360px;width:100%;text-align:center}
.small{font-size:11px;color:#94a3b8}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px}
.val{font-size:22px;font-weight:900;margin-top:4px}
</style>
</head>
<body>
<div id="login"><div class="box"><h2 style="font-weight:900">💰 TREASURER LOGIN</h2><p class="small" style="margin-top:6px">Record contributions & approve requests</p><input id="pin" class="input" style="background:#f9fafb;color:#000" type="password" placeholder="Treasurer PIN (0000)"><button class="btn btn-g" style="width:100%;margin-top:14px" onclick="doLogin()">ENTER TREASURER</button><p class="small" style="margin-top:10px"><a href="../index.html" style="color:#000;font-weight:800">Back to Aneman</a></p></div></div>

<div class="top"><div><div style="font-weight:900">ANEMAN - TREASURER SIDE</div><div style="font-size:10px;opacity:.6">Can add payments & approve</div></div><div><button class="btn btn-d" onclick="logout()">Logout</button></div></div>

<div class="statGrid">
<div class="card"><div style="font-size:10px;opacity:.6">TOTAL POT</div><div class="val" id="pot">R0</div></div>
<div class="card"><div style="font-size:10px;opacity:.6">PENDING</div><div class="val" id="pCount">0</div></div>
</div>

<div class="card"><h3>💰 Record Contribution</h3><select id="pSelect" class="input"></select><div style="display:flex;gap:8px;margin-top:8px"><input id="pAmt" class="input" type="number" placeholder="Amount"><button class="btn btn-y" style="width:120px" onclick="addPay()">ADD +</button></div></div>

<div class="card"><h3>⚠️ Pending Requests</h3><div id="pendList"></div></div>

<div class="card"><h3>👥 Members Balances (View Only - PIN Visible)</h3><div id="mList"></div></div>

<div class="card"><h3>📜 Recent Payments</h3><div id="hList"></div></div>

<script>
const DB_KEY="aneman_prod_final";
let db=JSON.parse(localStorage.getItem(DB_KEY)||'{"members":[],"payments":[],"requests":[],"pins":{"admin":"1234","treasurer":"0000"}}');
function check(){ if(localStorage.getItem("aneman_treas_side")!="1"){ document.getElementById("login").style.display="flex"; } else { document.getElementById("login").style.display="none"; render(); } }
function doLogin(){ let p=document.getElementById("pin").value; if(p==db.pins.treasurer){ localStorage.setItem("aneman_treas_side","1"); document.getElementById("login").style.display="none"; render(); } else alert("Wrong Treasurer PIN. Default 0000"); }
function logout(){ localStorage.removeItem("aneman_treas_side"); location.reload(); }
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); render(); }
function addPay(){ let name=document.getElementById("pSelect").value; let amt=parseFloat(document.getElementById("pAmt").value); if(!name||!amt) return alert("Select member and amount"); db.payments.push({name,amount:amt,time:Date.now(),date:new Date().toLocaleDateString(),by:"TREASURER"}); save(); document.getElementById("pAmt").value=""; }
function approve(id){ let r=db.requests.find(x=>x.id==id); let sent=db.payments.filter(p=>p.name==r.name).reduce((s,p)=>s+p.amount,0); let taken=db.requests.filter(x=>x.name==r.name&&x.status=="approved").reduce((s,x)=>s+x.amount,0); if(r.amount>(sent-taken)) return alert(r.name+" only has R"+(sent-taken)); r.status="approved"; save(); }
function decline(id){ db.requests.find(x=>x.id==id).status="declined"; save(); }
function render(){
  db=JSON.parse(localStorage.getItem(DB_KEY)||'{"members":[],"payments":[],"requests":[],"pins":{"admin":"1234","treasurer":"0000"}}');
  let pot=db.payments.reduce((s,p)=>s+p.amount,0)-db.requests.filter(r=>r.status=="approved").reduce((s,r)=>s+r.amount,0);
  document.getElementById("pot").innerText="R"+pot.toLocaleString(); document.getElementById("pCount").innerText=db.requests.filter(r=>r.status=="pending").length;
  let sel=document.getElementById("pSelect"); sel.innerHTML='<option value="">Select member</option>'; db.members.forEach(m=>{ let o=document.createElement("option"); o.value=m.name; o.textContent=m.name; sel.appendChild(o); });
  let ml=document.getElementById("mList"); ml.innerHTML=""; db.members.forEach(m=>{
    let s=db.payments.filter(p=>p.name==m.name).reduce((a,b)=>a+b.amount,0); let t=db.requests.filter(r=>r.name==m.name&&r.status=="approved").reduce((a,b)=>a+b.amount,0);
    ml.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #166534"><div><b>${m.name}</b><br><span class="small">PIN:${m.pin} • Limit R${m.limit}</span></div><div style="font-weight:900">R${s-t}</div></div>`;
  });
  let pl=document.getElementById("pendList"); pl.innerHTML=""; let pend=db.requests.filter(r=>r.status=="pending"); if(!pend.length) pl.innerHTML="<p class='small'>No pending</p>"; pend.forEach(r=>{ pl.innerHTML+=`<div style="background:#022c22;border:1px solid #166534;border-radius:12px;padding:10px;margin-top:8px"><b>${r.name}</b> R${r.amount} ${r.reason}<div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-y" style="flex:1" onclick="approve(${r.id})">Approve</button><button class="btn btn-d" style="flex:1" onclick="decline(${r.id})">Decline</button></div></div>`; });
  let hl=document.getElementById("hList"); hl.innerHTML=""; db.payments.slice(-20).reverse().forEach(t=>{ hl.innerHTML+=`<div style="padding:8px 0;border-bottom:1px solid #14532d;display:flex;justify-content:space-between;font-size:12px"><span>✅ ${t.name} +R${t.amount}</span><span style="opacity:.5">${t.date}</span></div>`; });
}
check();
</script>
</body>
</html>
