<!DOCTYPE html>
<html>
<head>
 <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8B71GWH6TH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8B71GWH6TH');
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aneman Clinic - Book Visit</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f7f9fb;color:#000;font-family:system-ui}
.top{background:#0e4a7b;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.top h1{margin:0;font-size:18px} .top small{display:block;color:#7ec8ff;font-size:11px;font-weight:800;letter-spacing:1px}
.search{padding:12px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:62px;z-index:9}
.search input{width:100%;padding:14px;border-radius:12px;border:1px solid #ccc;background:#f2f6f9;color:#000}
.cats{display:flex;gap:8px;padding:12px;overflow:auto;background:#fff;border-bottom:1px solid #eee}
.cat{white-space:nowrap;padding:10px 16px;border-radius:20px;border:1px solid #ccc;background:#fff;color:#000;font-weight:800;font-size:12px}
.cat.active{background:#0e4a7b;color:#fff}
.grid{padding:12px;display:grid;gap:12px;padding-bottom:120px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;display:flex;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.card .icon{width:54px;height:54px;background:#e6f0f9;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.info{flex:1} .info h3{margin:0;font-size:14px} .info p{margin:4px 0 0;font-size:11px;color:#666;line-height:1.3}
.price{font-weight:900;margin-top:6px;font-size:13px;color:#0e4a7b}
.card button{padding:10px 16px;border-radius:10px;border:0;background:#0e4a7b;color:#fff;font-weight:900;font-size:11px;height:36px;align-self:center}
.cart{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;padding:16px;border-radius:20px 20px 0 0;transform:translateY(100%);transition:.3s;z-index:100;max-height:80vh;overflow:auto}
.cart.open{transform:translateY(0)} .cart-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:12px}
.checkout{width:100%;padding:14px;border-radius:12px;border:0;background:#0e4a7b;color:#fff;font-weight:900;margin-top:10px}
</style>
</head>
<body>
<div class="top"><div><h1>🏥 ANEMAN CLINIC</h1><small>BOOK PROCEDURE • LIVE QUEUE</small></div><button onclick="toggleCart()" style="background:#fff;color:#0e4a7b;padding:8px 14px;border-radius:20px;border:0;font-weight:900;font-size:12px">🛒 <span id="cCount">0</span> • R<span id="cTotal">0</span></button></div>
<div class="search"><input id="search" placeholder="🔍 Search consultation, blood test, vaccine..." oninput="render()"></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="cart" id="cart"><h3 style="color:#7ec8ff;margin:0 0 10px">Your Booking</h3><div id="cartItems"></div><input id="pName" placeholder="Patient Name" style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;margin-top:10px"><input id="pPhone" placeholder="Phone 07..." style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;margin-top:8px"><button class="checkout" onclick="book()">CONFIRM BOOKING</button><button onclick="toggleCart()" style="width:100%;margin-top:8px;background:transparent;color:#888;border:0">Close</button></div>

<script>
let cats=['All','Consultation','Lab Tests','Vaccines','Procedures','Emergency'];
let procedures=JSON.parse(localStorage.getItem('aneman_clinic')||'null')||[
{id:1,name:'General Consultation',price:250,duration:'15 min',desc:'Doctor check-up, diagnosis & prescription',emoji:'🩺',cat:'Consultation',stock:20},
{id:2,name:'Blood Pressure Check',price:80,duration:'5 min',desc:'Quick BP reading + advice',emoji:'❤️',cat:'Consultation',stock:30},
{id:3,name:'Blood Test Full',price:350,duration:'10 min',desc:'Full blood count, sugar, cholesterol',emoji:'🧪',cat:'Lab Tests',stock:15},
{id:4,name:'HIV Test',price:150,duration:'10 min',desc:'Confidential rapid test + counseling',emoji:'🧬',cat:'Lab Tests',stock:25},
{id:5,name:'Pregnancy Test',price:100,duration:'5 min',desc:'Rapid test + consultation',emoji:'🤰',cat:'Lab Tests',stock:20},
{id:6,name:'Flu Vaccine',price:280,duration:'5 min',desc:'Seasonal flu protection',emoji:'💉',cat:'Vaccines',stock:12},
{id:7,name:'Baby Vaccines',price:200,duration:'15 min',desc:'Routine immunization per schedule',emoji:'👶',cat:'Vaccines',stock:18},
{id:8,name:'Wound Dressing',price:120,duration:'20 min',desc:'Cleaning, dressing, infection check',emoji:'🩹',cat:'Procedures',stock:22},
{id:9,name:'Nebulization',price:180,duration:'15 min',desc:'For asthma / breathing difficulty',emoji:'😮‍💨',cat:'Procedures',stock:8},
{id:10,name:'Family Planning',price:150,duration:'20 min',desc:'Consultation + injection/pills',emoji:'👩‍⚕️',cat:'Consultation',stock:15},
{id:11,name:'STI Screening',price:300,duration:'15 min',desc:'Confidential screening + treatment',emoji:'🔬',cat:'Lab Tests',stock:10},
{id:12,name:'Emergency Care',price:400,duration:'30 min',desc:'Urgent care, stabilization',emoji:'🚑',cat:'Emergency',stock:5},
];
let bookings=JSON.parse(localStorage.getItem('aneman_clinic_bookings')||'[]');
let cart=[]; let active='All';
function save(){localStorage.setItem('aneman_clinic',JSON.stringify(procedures));localStorage.setItem('aneman_clinic_bookings',JSON.stringify(bookings))}
function renderCats(){let c=document.getElementById('cats');c.innerHTML='';cats.forEach(cat=>{let b=document.createElement('button');b.className='cat'+(cat==active?' active':'');b.textContent=cat;b.onclick=()=>{active=cat;renderCats();render()};c.appendChild(b);})}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let g=document.getElementById('grid');g.innerHTML='';
 procedures.filter(p=>(active=='All'||p.cat==active)&&p.name.toLowerCase().includes(q)).forEach(p=>{
  let d=document.createElement('div');d.className='card';
  d.innerHTML=`<div class="icon">${p.emoji}</div><div class="info"><h3>${p.name}</h3><p>${p.desc}</p><p style="color:#0e4a7b;font-weight:800">${p.duration} • ${p.stock} slots left</p><div class="price">R${p.price}</div></div><button ${p.stock<=0?'disabled style="background:#ddd"':''} onclick="add(${p.id})">${p.stock<=0?'FULL':'BOOK'}</button>`;
  g.appendChild(d);
 });updateCart();save();
}
function add(id){let p=procedures.find(x=>x.id==id);if(p.stock<=0)return alert('Fully booked');let c=cart.find(x=>x.id==id);if(c){if(c.qty>=p.stock)return alert('No more slots');c.qty++}else cart.push({id:p.id,name:p.name,price:p.price,qty:1});updateCart()}
function updateCart(){document.getElementById('cCount').textContent=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('cTotal').textContent=cart.reduce((a,b)=>a+b.price*b.qty,0);let ci=document.getElementById('cartItems');ci.innerHTML='';cart.forEach(c=>{let d=document.createElement('div');d.className='cart-item';d.innerHTML=`<span>${c.name} x${c.qty}</span><span>R${c.price*c.qty} <button onclick="rem(${c.id})" style="background:none;border:0;color:#ff3b30">✕</button></span>`;ci.appendChild(d);});if(cart.length==0)ci.innerHTML='<small style="color:#888">No procedures selected</small>'}
function rem(id){cart=cart.filter(x=>x.id!=id);updateCart()}
function refund(bookingId){
  // find booking
  let b = bookings.find(x=>x.id==bookingId);
  if(!b) return alert('Not found');
  if(b.status=='REFUNDED') return alert('Already refunded');
  
  // MINUS THE SALE + RETURN STOCK
  b.procedures.forEach(item=>{
    let p = procedures.find(x=>x.id==item.id);
    if(p) p.stock += item.qty; // put stock back
  });
  
  b.status = 'REFUNDED';
  b.refundedAt = new Date().toISOString();
  
  // save everything
  localStorage.setItem('aneman_clinic_bookings', JSON.stringify(bookings));
  save(); // saves procedures stock
  render();
  alert('Refunded R' + b.total + ' - Sale minused, stock returned');
  location.reload();
}
function toggleCart(){document.getElementById('cart').classList.toggle('open')}
function book(){
 if(cart.length==0)return alert('Select procedure');let name=document.getElementById('pName').value,phone=document.getElementById('pPhone').value;if(!name||!phone)return alert('Enter patient name & phone');
 cart.forEach(c=>{let p=procedures.find(x=>x.id==c.id);p.stock-=c.qty;bookings.push({id:Date.now()+c.id,patient:name,phone,procedure:c.name,price:c.price*c.qty,qty:c.qty,type:'sale',date:new Date().toISOString(),status:'waiting'});});
 alert('✅ Booked for '+name+' - Total R'+cart.reduce((a,b)=>a+b.price*b.qty,0));cart=[];document.getElementById('pName').value='';document.getElementById('pPhone').value='';toggleCart();render();
}
renderCats();render();
</script>
</body>
</html>
